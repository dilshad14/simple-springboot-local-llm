# Prometheus scrapes the Spring Boot app on the host (not the OTel collector for app metrics).
global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  # Spring Boot Actuator — requires micrometer-registry-prometheus + app on :8082
  - job_name: spring-boot
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ["host.docker.internal:8082"]
        labels:
          application: langchain4j-llm

  # OTel Collector self-metrics (requires service.telemetry in otel-collector-config.yaml)
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8888"]

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
