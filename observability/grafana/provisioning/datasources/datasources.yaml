apiVersion: 1

datasources:
  # Metrics (Prometheus) — default; use for graphs, rates, latency percentiles
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # Traces (Tempo) — optional; use for span waterfall (requires --profile traces)
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:
      httpMethod: GET
      nodeGraph:
        enabled: true
      tracesToMetrics:
        datasourceUid: prometheus
      tracesToLogs:
        datasourceUid: prometheus
