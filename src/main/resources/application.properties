spring.application.name=LangChain4j Spring Boot Example
server.port=8082

#langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY}
#langchain4j.open-ai.chat-model.model-name=gpt-4o-mini
#langchain4j.open-ai.chat-model.log-requests=true
#langchain4j.open-ai.chat-model.log-responses=true
#langchain4j.ollama.base-url=http://localhost:11434
#langchain4j.ollama.chat-model.model-name=gemma3

#langchain4j.open-ai.streaming-chat-model.api-key=${OPENAI_API_KEY}
#langchain4j.open-ai.streaming-chat-model.model-name=gpt-4o-mini
#langchain4j.open-ai.streaming-chat-model.log-requests=true
#langchain4j.open-ai.streaming-chat-model.log-responses=true

logging.level.dev.langchain4j=DEBUG

management.endpoints.web.exposure.include=*
management.tracing.sampling.probability=1


management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
# Trace/span IDs in console logs (correlate with Grafana)
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr([${spring.application.name},%X{traceId:-},%X{spanId:-}]){yellow} %clr(:){faint} %m%n%wEx


# Zipkin off — use Grafana stack instead (profile: observability)
spring.zipkin.enabled=false
# See observability/docker-compose.yml and README observability section
