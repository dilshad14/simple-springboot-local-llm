spring.application.name=Spring AI Spring Boot Example
server.port=8082

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.2:latest
spring.ai.ollama.embedding.model=nomic-embed-text

logging.level.org.springframework.ai=DEBUG

spring.ai.chat.observations.log-prompt=true
spring.ai.chat.observations.log-completion=true
spring.ai.chat.observations.include-error-logging=true

management.endpoints.web.exposure.include=*
management.observations.annotations.enabled=true
management.tracing.sampling.probability=1

management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr([${spring.application.name},%X{traceId:-},%X{spanId:-}]){yellow} %clr(:){faint} %m%n%wEx

spring.zipkin.enabled=false
