# Activate when Grafana stack is running:
#   docker compose -f observability/docker-compose.yml up -d
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=observability
#
# Or: --spring.profiles.active=observability

management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces

# Histogram buckets for Grafana / PromQL percentile panels (default is summary-only)
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Expose /actuator/prometheus for Prometheus scrape (Docker stack)
management.prometheus.metrics.export.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus,metrics

# Trace/span IDs in console logs (correlate with Grafana)
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr([${spring.application.name},%X{traceId:-},%X{spanId:-}]){yellow} %clr(:){faint} %m%n%wEx
