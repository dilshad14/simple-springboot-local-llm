<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Chat Assistant</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .chat-container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 0;
            overflow: hidden;
            height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.2em;
            font-weight: 600;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 75%;
            word-wrap: break-word;
            line-height: 1.4;
            position: relative;
            animation: messageSlideIn 0.3s ease-out;
        }
        
        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .user-message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        
        .assistant-message {
            background: white;
            color: #333;
            margin-right: auto;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .streaming {
            border-left: 3px solid #28a745;
            animation: streamingPulse 1.5s infinite;
        }
        
        @keyframes streamingPulse {
            0%, 100% { border-left-color: #28a745; }
            50% { border-left-color: #17a2b8; }
        }
        
        .input-container {
            display: flex;
            gap: 12px;
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }
        
        #messageInput {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        #messageInput:focus {
            border-color: #667eea;
        }
        
        button {
            padding: 15px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            min-width: 80px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 10px 0;
            color: #666;
            font-style: italic;
        }
        
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #666;
        }
        
        .typing-dots {
            display: flex;
            gap: 3px;
        }
        
        .typing-dots span {
            width: 6px;
            height: 6px;
            background: #666;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }
        
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typingBounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 5px;
            }
            
            .chat-container {
                height: calc(100vh - 20px);
                border-radius: 15px;
            }
            
            .message {
                max-width: 85%;
            }
            
            .chat-header {
                padding: 15px;
                font-size: 1.1em;
            }
            
            .input-container {
                padding: 15px;
            }
            
            #messageInput {
                padding: 12px 15px;
                font-size: 16px;
            }
            
            button {
                padding: 12px 20px;
                min-width: 70px;
            }
        }
        
        @media (max-width: 480px) {
            .message {
                max-width: 90%;
                padding: 10px 14px;
            }
            
            .input-container {
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            🤖 Ollama Chat Assistant
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="loading" id="loading">
            <div class="typing-indicator">
                Assistant is typing
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Type your message here...">
            <button id="sendButton" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const loading = document.getElementById('loading');
        const sendButton = document.getElementById('sendButton');

        function formatMessage(message) {
            return message
                // Convert newlines to <br>
                .replace(/\n/g, '<br>')
                // Convert *** to line breaks
                .replace(/\*\*/g, '<br>')
                // Add line breaks before numbered points
                .replace(/(\d+\.\*\*)/g, '<br><br>$1')
                // Clean up any double breaks at the start
                //.replace(/^(<br>)+/, '')
                // Make numbered points bold and add spacing
                .replace(/(\d+\.\*\*[^*]+\*\*)/g, '<strong>$1</strong>')
                // Remove the ** from bold text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        }

        function addMessage(message, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'assistant-message'}`;
            messageDiv.innerHTML = isUser ? message : formatMessage(message);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageDiv;
        }

        function createStreamingMessage() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant-message streaming';
            messageDiv.innerHTML = '';
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageDiv;
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // Disable input and button during processing
            messageInput.disabled = true;
            sendButton.disabled = true;
            sendButton.textContent = 'Sending...';

            // Add user message to chat
            addMessage(message, true);
            messageInput.value = '';

            // Create streaming message container
            const assistantMessageDiv = createStreamingMessage();

            // Show loading indicator
            loading.style.display = 'block';

            try {
                // Try streaming endpoint first
                const streamResponse = await fetch(`/ollama-stream-assistant?message=${encodeURIComponent(message)}`);

                if (streamResponse.ok) {
                    loading.style.display = 'none';
                    await handleStreamingResponse(streamResponse, assistantMessageDiv);
                } else {
                    // Fallback to regular endpoint
                    const response = await fetch(`/ollama-assistant?message=${encodeURIComponent(message)}`);
                    const data = await response.text();
                    
                    loading.style.display = 'none';
                    assistantMessageDiv.classList.remove('streaming');
                    assistantMessageDiv.innerHTML = formatMessage(data);
                }
            } catch (error) {
                loading.style.display = 'none';
                assistantMessageDiv.classList.remove('streaming');
                assistantMessageDiv.innerHTML = 'Sorry, there was an error processing your request.';
                console.error('Error:', error);
            } finally {
                // Re-enable input and button
                messageInput.disabled = false;
                sendButton.disabled = false;
                sendButton.textContent = 'Send';
                messageInput.focus();
            }
        }

        async function handleStreamingResponse(response, messageDiv) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullResponse = '';
            let buffer = '';

            try {
                while (true) {
                    const { done, value } = await reader.read();
                    
                    if (done) {
                        messageDiv.classList.remove('streaming');
                        break;
                    }
                    
                    // Decode the chunk and add to buffer
                    const chunk = decoder.decode(value, { stream: true });
                    buffer += chunk;
                    
                    console.log('Received chunk:', chunk); // Debug log
                    
                    // Handle Server-Sent Events format properly
                    // Split by lines first, then process data: lines
                    const lines = buffer.split('\n');
                    
                    // Keep the last line in buffer (might be incomplete)
                    buffer = lines.pop() || '';
                    
                    for (const line of lines) {
                        // Process only data: lines
                        if (line.startsWith('data:')) {
                            let textToAdd = line.substring(5); // Remove 'data:' prefix
                            
                            // Skip completion signals
                            if (textToAdd === '[DONE]' || textToAdd === 'DONE' || textToAdd.trim() === '') {
                                continue;
                            }
                            
                            fullResponse += textToAdd;
                            // Format the message properly with numbered lists and styling
                            messageDiv.innerHTML = formatMessage(fullResponse);
                            chatMessages.scrollTop = chatMessages.scrollHeight;
                            
                            // Add small delay to make streaming visible
                            await new Promise(resolve => setTimeout(resolve, 30));
                        }
                    }
                }
                
                // Process any remaining buffer content
                if (buffer && buffer.startsWith('data:')) {
                    let finalText = buffer.substring(5);
                    if (finalText && finalText !== '[DONE]' && finalText !== 'DONE' && finalText.trim() !== '') {
                        fullResponse += finalText;
                        messageDiv.innerHTML = formatMessage(fullResponse);
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    }
                }
                
                // Remove streaming indicator when done
                messageDiv.classList.remove('streaming');
                
            } catch (error) {
                console.error('Streaming error:', error);
                messageDiv.classList.remove('streaming');
                messageDiv.innerHTML = formatMessage(fullResponse || 'Error occurred during streaming.');
            }
        }

        // Allow sending message with Enter key
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !messageInput.disabled) {
                sendMessage();
            }
        });

        // Focus on input when page loads
        window.addEventListener('load', function() {
            messageInput.focus();
        });
    </script>
</body>
</html>
